<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pink Tic-Tac-Toe</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="container">
  <h1>Tic <span>Tac</span> Toe</h1>
  <div class="subtitle">✨ a cute little match ✨</div>

  <div class="scoreboard">
    <div class="score-card" id="cardX">
      <div class="label">Player X</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div class="score-card" id="cardTie">
      <div class="label">Ties</div>
      <div class="value" id="scoreTie">0</div>
    </div>
    <div class="score-card" id="cardO">
      <div class="label">Player O</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>

  <div class="status" id="status">Player X's turn</div>

  <div class="board" id="board"></div>

  <button class="btn" id="restartBtn">🔄 Restart Game</button>

  <div class="spin-overlay" id="spinOverlay">
    <div class="spin-text" id="spinText">Spinning to pick who starts...</div>
    <div class="wheel" id="wheel">
      <div class="wheel-face" id="wheelFace">X</div>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
